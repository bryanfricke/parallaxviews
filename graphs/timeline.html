                // secure total" rather than "a very small count."
                const unavailableWorks = works.filter(w => manuscriptDisplayValue(w.manuscriptCount) == null);
                const dashSel = mssBarsLayer.selectAll("line.mss-bar-unavailable")
                    .data(unavailableWorks, w => w.id);

                const dashEnter = dashSel.enter().append("line")
                    .attr("class", "mss-bar-unavailable")
                    .attr("x1", mssBarLeftX)
                    .attr("x2", mssBarLeftX + MSS_BAR.unavailableWidth);

                attachMssHandlers(dashEnter.merge(dashSel))
                    .attr("y1", w => mssBarY(w) + MSS_BAR.height / 2)
                    .attr("y2", w => mssBarY(w) + MSS_BAR.height / 2);

                dashSel.exit().remove();

                // Composition bars (work composition ranges)
                const compSel = layers.comp.selectAll("rect")
                    .data(works.filter(w => w.composition), d => d.id);

                function compTooltip(d, pinned) {
                    const start = getStart(d.composition);
                    const end = getEnd(d.composition);
                    const dr = `${fmtYear(start)}–${fmtYear(end)}`;
                    const earliest = earliestWitnessSummary(d);
                    const { author, work } = axisLabelParts(d);
                    const original = ORIGINAL_TITLE[d.id];
                    return `
              <div class="tt-eyebrow">Original composition</div>
              <div class="tt-title">${author ? `${author} — <i>${work}</i>` : work}</div>
              ${original ? `<div class="tt-original-title">${original}</div>` : ""}
              ${!author && d.author ? `<div class="tt-subtitle">${d.author}</div>` : ""}
              <div class="tt-divider"></div>
              ${ttRow("Composed", dr)}
              <div class="tt-note">${d.composition.label}</div>
              ${earliest ? `<div class="tt-divider"></div>` : ""}
              ${earliest ? ttRow("Earliest copy", earliest.label) : ""}
              ${earliest ? ttRow("Manuscript date", earliest.dateRange) : ""}
              ${earliest ? ttRow("Gap from autograph", `${earliest.gap} later`) : ""}
              ${manuscriptCountSection(d)}
              ${d.description ? `<div class="tt-divider"></div><div class="tt-note">${d.description}</div>` : ""}
              ${pinned ? `<div class="tt-pin-hint">Click anywhere to dismiss.</div>` : ""}
            `;
                }

                // Composition bars render at a fixed fraction of the row height, not
                // full bandwidth, so they read as a band sitting within the row (and
                // stay clearly taller than the manuscript marks without touching
                // neighboring rows). Width has only a 2px floor — short composition
                // estimates stay a narrow rectangle rather than being forced into a
                // wider minimum shape.
                const COMP_BAR_HEIGHT_RATIO = 0.62;
                const compBarInset = d => yScale.bandwidth() * (1 - COMP_BAR_HEIGHT_RATIO) / 2;

                compSel.enter().append("rect")
                    .attr("class", "comp-bar")
                    .attr("rx", 2)
                    .attr("ry", 2)
                    .style("cursor", "pointer")
                    .merge(compSel)
                    .attr("x", d => xZoomed(getStart(d.composition)))
                    .attr("y", d => yScale(d.id) + compBarInset(d))
                    .attr("width", d => Math.max(2, xZoomed(getEnd(d.composition)) - xZoomed(getStart(d.composition))))
                    .attr("height", () => yScale.bandwidth() * COMP_BAR_HEIGHT_RATIO)
                    .attr("fill", d => accentForGroup(d.group))
                    .attr("stroke", d => accentForGroup(d.group))
                    .attr("tabindex", 0)
                    .on("mousemove", (evt, d) => {
                        showTip(evt, compTooltip(d, false));
                        setActiveRow(d.id, d.group);
                        showCrucifixionMarker(d.relatesToCrucifixion, d.id);
                    })
                    .on("mouseleave", () => { hideTip(); clearActiveRow(); hideCrucifixionMarker(); })
                    .on("focus", (evt, d) => {
                        showTipNear(evt.currentTarget, compTooltip(d, false));
                        setActiveRow(d.id, d.group);
                        showCrucifixionMarker(d.relatesToCrucifixion, d.id);
                    })
                    .on("blur", () => { hideTip(); clearActiveRow(); hideCrucifixionMarker(); })
                    .on("click", (evt, d) => {
                        evt.stopPropagation();
                        showTip(evt, compTooltip(d, true));
                    });

                compSel.exit().remove();

                // Witness marks: a small dot for a single attested date, or a rounded
                // capsule spanning the range when the witness date is uncertain.
                witnessRows = [];
                for (const w of works) {
                    const compStart = w.composition ? getStart(w.composition) : null;
                    const compEnd = w.composition ? getEnd(w.composition) : null;
                    for (const ms of (w.witnesses ?? [])) {
                        const start = getStart(ms.date);
                        const end = getEnd(ms.date) ?? start;
                        witnessRows.push({
                            workId: w.id, workTitle: standardTitle(w), group: w.group, language: w.language,
                            relatesToCrucifixion: w.relatesToCrucifixion,
                            ...ms, _start: start, _end: end, _hasRange: end !== start,
                            _compStart: compStart, _compEnd: compEnd
                        });
                    }
                }

                const dodgeOffsets = computeDodgeOffsets(witnessRows);
                const dodgeFor = d => dodgeOffsets.get(d) || 0;
                const accentFor = d => accentForGroup(d.group);

                function witnessTooltip(d, pinned) {
                    const dr = d._hasRange ? `${fmtYear(d._start)}–${fmtYear(d._end)}` : fmtYear(d._start);
                    const gap = formatGap(d._compStart, d._compEnd, d._start, d._end);
                    return `
              <div class="tt-eyebrow">${formatWitnessType(d.type)}</div>
              <div class="tt-title">${d.label}</div>
              <div class="tt-subtitle">${d.workTitle} · ${d.language}</div>
              <div class="tt-divider"></div>
              ${d._compStart != null ? ttRow("Composed", `${fmtYear(d._compStart)}–${fmtYear(d._compEnd)}`) : ""}
              ${ttRow("Manuscript date", dr)}
              ${gap ? ttRow("Gap from autograph", `${gap} later`) : ""}
              ${ttRow("Contents", d.contents)}
              ${d.notes ? `<div class="tt-divider"></div><div class="tt-note">${d.notes}</div>` : ""}
              ${pinned ? `<div class="tt-pin-hint">Click anywhere to dismiss.</div>` : ""}
            `;
                }

                // Shared hover/pin behavior for every manuscript mark piece (the point
                // diamond, and — for ranges — the connecting line and its two end
                // diamonds), so hovering any piece of a mark behaves identically.
                function attachWitnessHandlers(sel) {
                    return sel
                        .attr("tabindex", 0)
                        .on("mousemove", (evt, d) => {
                            showTip(evt, witnessTooltip(d, false));
                            setActiveRow(d.workId, d.group);
                            showCrucifixionMarker(d.relatesToCrucifixion, d.workId);
                        })
                        .on("mouseleave", () => { hideTip(); clearActiveRow(); hideCrucifixionMarker(); })
                        .on("focus", (evt, d) => {
                            showTipNear(evt.currentTarget, witnessTooltip(d, false));
                            setActiveRow(d.workId, d.group);
                            showCrucifixionMarker(d.relatesToCrucifixion, d.workId);
                        })
                        .on("blur", () => { hideTip(); clearActiveRow(); hideCrucifixionMarker(); })
                        .on("click", (evt, d) => {
                            // "Pin" behavior: click keeps it visible until next click elsewhere
                            evt.stopPropagation();
                            showTip(evt, witnessTooltip(d, true));
                        });
                }

                // Point witnesses (effectively a single attested date): one diamond.
                // Lives outside zoomLayer (see witnessMarkersLayer) so the diamond's
                // shape stays undistorted at any zoom level; position is recomputed
                // from the live xZoomed here and again in updateAxis() on every tick.
                const pointSel = witnessMarkersLayer.selectAll("path.witness-marker")
                    .data(witnessRows.filter(d => !d._hasRange), d => `${d.workId}:${d.id}`);

                attachWitnessHandlers(pointSel.enter().append("path").attr("class", "witness-marker"))
                    .merge(pointSel)
                    .attr("fill", accentFor)
                    .attr("d", d => diamondPath(xZoomed(d._start), laneCenterY(d) + dodgeFor(d), DIAMOND_RADIUS));

                pointSel.exit().remove();

                // Ranged witnesses (date uncertainty): a thin connecting line — which
                // legitimately stretches with zoom since its length encodes the date
                // span — plus a diamond at each end. The line stays inside zoomLayer
                // (like the composition bars); its diamonds live in witnessMarkersLayer
                // alongside the point markers.
                const rangeLineSel = layers.witnesses.selectAll("line.witness-range-line")
                    .data(witnessRows.filter(d => d._hasRange), d => `${d.workId}:${d.id}`);

                attachWitnessHandlers(rangeLineSel.enter().append("line").attr("class", "witness-range-line"))
                    .merge(rangeLineSel)
                    .attr("stroke", accentFor)
                    .attr("x1", d => xZoomed(d._start))
                    .attr("x2", d => xZoomed(d._end))
                    .attr("y1", d => laneCenterY(d) + dodgeFor(d))
                    .attr("y2", d => laneCenterY(d) + dodgeFor(d));

                rangeLineSel.exit().remove();

                const rangeStartSel = witnessMarkersLayer.selectAll("path.witness-range-point-start")
                    .data(witnessRows.filter(d => d._hasRange), d => `${d.workId}:${d.id}`);

                attachWitnessHandlers(rangeStartSel.enter().append("path").attr("class", "witness-range-point witness-range-point-start"))
                    .merge(rangeStartSel)
                    .attr("fill", accentFor)
                    .attr("d", d => diamondPath(xZoomed(d._start), laneCenterY(d) + dodgeFor(d), DIAMOND_RADIUS));

                rangeStartSel.exit().remove();

                const rangeEndSel = witnessMarkersLayer.selectAll("path.witness-range-point-end")
                    .data(witnessRows.filter(d => d._hasRange), d => `${d.workId}:${d.id}`);

                attachWitnessHandlers(rangeEndSel.enter().append("path").attr("class", "witness-range-point witness-range-point-end"))
                    .merge(rangeEndSel)
                    .attr("fill", accentFor)
                    .attr("d", d => diamondPath(xZoomed(d._end), laneCenterY(d) + dodgeFor(d), DIAMOND_RADIUS));

                rangeEndSel.exit().remove();
            }

            // Update axis during zoom
            function updateAxis() {
                if (!xScale) return;

                xZoomed = currentTransform.rescaleX(xScale);

                // Reposition the midline directly since it's no longer inside the zoom
                // layer's scale transform (kept out of it to avoid stretching it).
                const midX = xZoomed(0);
                layers.midline.select("line").attr("x1", midX).attr("x2", midX);

                if (activeCrucifixionRow) positionCrucifixionMarker();

                // Re-run the vertical dodge at the current zoom level: witnesses that
                // were colliding may separate once zoomed in (and should re-center), or
                // vice versa. The range line's x1/x2 don't need updating — it's inside
                // zoomLayer, so its own transform handles that — but the diamonds live
                // outside zoomLayer (to avoid the non-uniform scale distorting their
                // shape) and so need both x *and* y recomputed from the live xZoomed on
                // every tick.
                if (yScale) {
                    const dodgeOffsets = computeDodgeOffsets(witnessRows);
                    const dodgeFor = d => dodgeOffsets.get(d) || 0;

                    layers.witnesses.selectAll("line.witness-range-line")
                        .attr("y1", d => laneCenterY(d) + dodgeFor(d))
                        .attr("y2", d => laneCenterY(d) + dodgeFor(d));

                    witnessMarkersLayer.selectAll("path.witness-marker")
                        .attr("d", d => diamondPath(xZoomed(d._start), laneCenterY(d) + dodgeFor(d), DIAMOND_RADIUS));
                    witnessMarkersLayer.selectAll("path.witness-range-point-start")
                        .attr("d", d => diamondPath(xZoomed(d._start), laneCenterY(d) + dodgeFor(d), DIAMOND_RADIUS));
                    witnessMarkersLayer.selectAll("path.witness-range-point-end")
                        .attr("d", d => diamondPath(xZoomed(d._end), laneCenterY(d) + dodgeFor(d), DIAMOND_RADIUS));
                }

                const xAxis = d3.axisBottom(xZoomed)
                    .ticks(10)
                    .tickFormat(d => fmtYear(d));

                xAxisG.call(xAxis)
                    .selectAll("text")
                    .attr("transform", "rotate(-25)")
                    .style("text-anchor", "end");
            }

            // Click anywhere to dismiss pinned tooltips
            document.addEventListener("click", () => { hideTip(); clearActiveRow(); });

            // Keep the chart responsive to its (possibly embedded) container width
            let resizeTimer = null;
            window.addEventListener("resize", () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(render, 120);
            });

            buildDocFilter(dataset.works);
            rerenderChart = render;
            render();
        })();
    </script>
